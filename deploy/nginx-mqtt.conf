# Example nginx site exposing the broker over WebSocket + TLS.
# Observers then use: wss://mqtt.example.org:443/mqtt with their account.
server {
  listen 443 ssl;
  server_name mqtt.example.org;

  ssl_certificate     /etc/letsencrypt/live/mqtt.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mqtt.example.org/privkey.pem;

  location /mqtt {
    proxy_pass http://127.0.0.1:9002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # MQTT connections stay open; keepalive pings arrive every minute or so.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
