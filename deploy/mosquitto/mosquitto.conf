# Broker for your own observers and, for testing, external ones.
#
# Every client needs an account (make mqtt-user NAME=...). The ACL lets any
# account publish under meshcore/ and only relayd read it back. Accounts are
# not tied to a node key, so an account holder could publish as any observer:
# fine for a test, not for an open service.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT: credentials travel in clear text. Keep it for your own network.
listener 1884

# MQTT over WebSocket, meant to sit behind a TLS reverse proxy (wss://.../mqtt).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
